<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom GMRJ Manager</title>
    <!-- Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --primary: #2D8CFF;
            --primary-hover: #1A75EB;
            --accent: #FF4757;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 1rem; overflow-x: hidden; padding-bottom: 100px; }

        header { text-align: center; margin-bottom: 2rem; max-width: 1200px; margin: 0 auto 2rem; padding: 0 1rem; }
        .brand { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; margin-bottom: 1rem; }
        .logo-text { font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .company-name { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; letter-spacing: 0.5px; text-align: center; }
        
        .btn-add { background: var(--primary); color: white; border: none; padding: 0.7rem 1.3rem; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.3s ease; font-size: 0.9rem; }
        .btn-add:hover { transform: translateY(-2px); background: var(--primary-hover); }

        .btn-add-header { display: inline-flex; }
        
        .btn-add-fixed { 
            display: none; 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 999;
            box-shadow: 0 4px 20px rgba(45, 140, 255, 0.4);
            padding: 0.65rem 1.2rem;
            font-size: 0.8rem;
            border-radius: 50px;
        }
        .btn-add-fixed:hover { transform: translateX(-50%) translateY(-2px); }
        .btn-add-fixed i { font-size: 1rem; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; padding: 0 1rem; justify-items: center; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--text-muted); border: 2px dashed var(--card-border); border-radius: 20px; max-width: 500px; margin: 0 auto; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 20px; box-shadow: var(--glass-shadow); overflow: hidden; transition: transform 0.3s ease; display: flex; flex-direction: column; width: 100%; max-width: 400px; }
        .card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); }
        .card-image { width: 100%; height: 160px; object-fit: cover; background: #334155; border-bottom: 1px solid var(--card-border); }
        .card-body { padding: 1.3rem; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; color: #fff; word-wrap: break-word; }
        .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .timer-box { background: rgba(0,0,0,0.3); padding: 0.8rem; border-radius: 10px; text-align: center; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.05); }
        .timer-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .countdown { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
        .countdown.urgent { color: var(--accent); animation: pulse 1.5s infinite; }
        .countdown.finished { color: #10b981; font-size: 0.95rem; }

        .info-row { display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 0.5rem; }
        .info-row i { color: var(--primary); font-size: 1rem; }

        .card-actions { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .btn-card { padding: 0.65rem; border-radius: 8px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 5px; transition: 0.2s; width: 100%; text-decoration: none; }
        
        .btn-join { background: var(--primary); color: white; }
        .btn-join:hover { background: var(--primary-hover); }
        
        .btn-pdf { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-pdf:hover { background: rgba(45, 140, 255, 0.1); }

        .btn-attend { background: var(--success); color: white; }
        .btn-attend:hover { background: #059669; }
        
        .btn-row { display: flex; gap: 0.5rem; }
        .btn-edit { background: var(--warning); color: white; flex: 1; }
        .btn-edit:hover { background: #d97706; }
        .btn-delete { background: rgba(255, 71, 87, 0.2); color: var(--accent); flex: 1; }
        .btn-delete:hover { background: var(--accent); color: white; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 1rem; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal { background: #1e293b; width: 100%; max-width: 500px; padding: 1.5rem; border-radius: 20px; border: 1px solid var(--card-border); transform: scale(0.9); transition: transform 0.3s; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; }
        .modal-overlay.active .modal { transform: scale(1); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; }
        .form-control { width: 100%; padding: 0.7rem; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 10px; color: white; font-size: 0.95rem; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        textarea.form-control { min-height: 80px; resize: vertical; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .btn-cancel { background: transparent; border: none; color: var(--text-muted); padding: 0.7rem 1.3rem; cursor: pointer; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 0.7rem 1.3rem; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-save:hover { background: var(--primary-hover); }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .file-upload-wrapper { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .file-upload-btn { border: 1px dashed var(--text-muted); color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s; width: 100%; }
        .file-upload-btn:hover { border-color: var(--primary); color: var(--primary); }
        #imageInput { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        #previewImage { max-width: 100%; width: 200px; height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; border: 2px solid var(--card-border); }

        .attendee-list { margin-top: 1rem; max-height: 300px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 10px; }
        .attendee-item { display: flex; flex-direction: column; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem; gap: 4px; animation: fadeIn 0.4s ease; }
        .attendee-item:last-child { border-bottom: none; }
        .attendee-header { display: flex; justify-content: space-between; align-items: center; }
        .attendee-name { font-weight: 600; color: var(--text-main); font-size: 1rem; }
        .attendee-time { font-size: 0.75rem; opacity: 0.7; color: var(--text-muted); }
        .attendee-status { font-size: 0.75rem; display: inline-block; padding: 2px 8px; border-radius: 4px; margin-top: 2px; font-weight: 500; }
        .status-hadir { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status-izin { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .attendee-reason { color: var(--text-muted); font-style: italic; font-size: 0.8rem; margin-top: 2px; background: rgba(255,255,255,0.03); padding: 4px 8px; border-radius: 4px; border-left: 2px solid var(--warning); }

        .attendance-notice { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; font-size: 0.85rem; color: #10b981; }

        /* Radio Group Style */
        .radio-group { display: flex; gap: 1rem; margin-bottom: 0.5rem; }
        .radio-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-main); font-size: 0.9rem; }
        .radio-label input { accent-color: var(--primary); width: 1.1em; height: 1.1em; }

        .toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 2000; display: flex; flex-direction: column; gap: 10px; max-width: calc(100% - 2rem); }
        .toast { background: #1e293b; border-left: 4px solid var(--primary); color: white; padding: 0.8rem 1.2rem; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s ease forwards; min-width: 250px; font-size: 0.85rem; }
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: var(--accent); }
        
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* Scrollbar Style */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body { padding: 0.5rem; padding-bottom: 90px; }
            header { margin-bottom: 1.5rem; }
            .logo-text { font-size: 1.3rem; }
            .company-name { font-size: 0.7rem; }
            .btn-add-header { display: none !important; }
            .btn-add-fixed { display: inline-flex !important; }
            .grid-container { gap: 1rem; padding: 0 0.5rem; }
            .card { max-width: 100%; }
            .card-body { padding: 1rem; }
            .modal { padding: 1.2rem; }
            .modal-actions { flex-direction: column; }
            .btn-cancel, .btn-save { width: 100%; }
        }

        @media (max-width: 480px) {
            .logo-text { font-size: 1.2rem; }
            .card-title { font-size: 1rem; }
            .card-desc { font-size: 0.8rem; }
            .countdown { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="ph ph-video-camera" style="font-size: 2.2rem; color: var(--primary);"></i>
            <div class="logo-text">Zoom GMRJ</div>
            <div class="company-name">PT Management Gusmus Raksa Jasad</div>
        </div>
        <button class="btn-add btn-add-header" onclick="checkPassword('add')">
            <i class="ph ph-plus-circle"></i> Tambah Meeting
        </button>
    </header>

    <main class="grid-container" id="meetingGrid">
        <div class="empty-state">
            <i class="ph ph-wifi-high" style="font-size: 3rem; color: var(--primary);"></i>
            <h3>Menunggu Data...</h3>
            <p>Menghubungkan ke Project Zoom-APS...</p>
        </div>
    </main>

    <!-- Button Fixed untuk Mobile -->
    <button class="btn-add btn-add-fixed" onclick="checkPassword('add')">
        <i class="ph ph-plus-circle"></i> Tambah Meeting
    </button>

    <!-- Modal Form -->
    <div class="modal-overlay" id="formModal">
        <div class="modal">
            <h2 id="formTitle">📅 Jadwal Baru GMRJ</h2>
            <form id="meetingForm">
                <input type="hidden" id="editMeetingId">
                <div class="form-group">
                    <label>📸 Upload Gambar (Max 800KB)</label>
                    <div class="file-upload-wrapper">
                        <div class="file-upload-btn"><i class="ph ph-image"></i> Klik untuk upload gambar</div>
                        <input type="file" id="imageInput" accept="image/*">
                        <img id="previewImage" src="" alt="Preview">
                    </div>
                </div>
                <div class="form-group">
                    <label>✍️ Judul Meeting</label>
                    <input type="text" id="title" class="form-control" placeholder="Rapat Koordinasi..." required>
                </div>
                <div class="form-group">
                    <label>📋 Agenda / Deskripsi</label>
                    <textarea id="desc" class="form-control" placeholder="Membahas..." required></textarea>
                </div>
                <div class="form-group">
                    <label>🕐 Tanggal & Waktu Meeting</label>
                    <input type="datetime-local" id="datetime" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>📍 Lokasi</label>
                    <input type="text" id="location" class="form-control" placeholder="Online / Ruang A" value="Online">
                </div>
                <div class="form-group">
                    <label>🔗 Link Zoom</label>
                    <input type="url" id="link" class="form-control" placeholder="https://zoom.us/j/..." required>
                </div>
                <div class="form-group">
                    <label>📄 Link PDF / Materi (Google Drive) (Opsional)</label>
                    <input type="url" id="pdfLink" class="form-control" placeholder="https://drive.google.com/...">
                    <small style="color: var(--text-muted); font-size: 0.75rem;">Link untuk tombol download PDF</small>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('formModal')">Batal</button>
                    <button type="submit" class="btn-save" id="submitBtn"><i class="ph ph-cloud-arrow-up"></i> Simpan ke Cloud</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Password -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal" style="max-width: 400px;">
            <h2>🔐 Keamanan</h2>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">Masukkan password untuk melanjutkan</p>
            <form id="passwordForm">
                <div class="form-group">
                    <input type="password" id="securityPass" class="form-control" placeholder="Masukkan password..." required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('passwordModal')">Batal</button>
                    <button type="button" class="btn-save" onclick="handlePasswordCheck(event)"><i class="ph ph-check-circle"></i> Verifikasi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Attendance -->
    <div class="modal-overlay" id="attendanceModal">
        <div class="modal">
            <h2>✅ Absensi Meeting</h2>
            <h3 id="attMeetingTitle" style="color: var(--primary); margin-bottom: 0.5rem; font-size: 1rem;"></h3>
            
            <div class="attendance-notice"><i class="ph ph-info"></i> Isi nama dan status kehadiran Anda</div>

            <div class="info-row" style="font-size: 0.95rem; margin-bottom: 1rem;">
                <i class="ph ph-users"></i> <strong>Total Peserta: <span id="attCount">0</span></strong>
            </div>
            
            <form id="attendanceForm" style="margin-bottom: 1rem;">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="attendeeName" class="form-control" placeholder="Nama Anda..." required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label>Status Kehadiran</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="attStatus" value="Hadir" checked onchange="toggleReasonField()"> Hadir
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="attStatus" value="Izin" onchange="toggleReasonField()"> Izin
                        </label>
                    </div>
                </div>

                <!-- Keterangan Field: Hidden by default, shown when Izin is selected -->
                <div class="form-group" id="reasonGroup" style="display: none; animation: fadeIn 0.3s ease;">
                    <label>Keterangan (Alasan Izin)</label>
                    <input type="text" id="attendeeReason" class="form-control" placeholder="Contoh: Sakit, Ada acara keluarga...">
                </div>

                <button type="submit" class="btn-save" style="width: 100%; margin-top: 10px;" id="btnSubmitAttendance">
                    <i class="ph ph-paper-plane-right"></i> Kirim Absensi
                </button>
            </form>

            <div class="attendee-list" id="attendeeList"></div>
            
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal('attendanceModal')">Tutup</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, arrayUnion, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByQrOw9zx8NUc6WYWLfldLzrTV2O_uljQ",
            authDomain: "zoom-aps.firebaseapp.com",
            projectId: "zoom-aps",
            storageBucket: "zoom-aps.firebasestorage.app",
            messagingSenderId: "107309363986",
            appId: "1:107309363986:web:23cbe59a5e17a1485bb9cb",
            measurementId: "G-2W1X1JW09P"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const meetingsCol = collection(db, "meetings");

        let meetings = [];
        const PASSWORD = "333100";
        let pendingAction = null, pendingDeleteId = null, pendingEditId = null, activeMeetingId = null, currentImageBase64 = null, isEditMode = false;

        const grid = document.getElementById('meetingGrid');
        const toastContainer = document.getElementById('toastContainer');
        const previewImg = document.getElementById('previewImage');
        const submitBtn = document.getElementById('submitBtn');
        const imageInput = document.getElementById('imageInput');
        const formTitle = document.getElementById('formTitle');
        const editMeetingId = document.getElementById('editMeetingId');
        const attendeeListContainer = document.getElementById('attendeeList');

        // Expose function to window for HTML onclick events
        window.toggleReasonField = function() {
            const status = document.querySelector('input[name="attStatus"]:checked').value;
            const reasonGroup = document.getElementById('reasonGroup');
            const reasonInput = document.getElementById('attendeeReason');
            
            if (status === 'Izin') {
                reasonGroup.style.display = 'block';
                reasonInput.setAttribute('required', 'required');
                reasonInput.focus();
            } else {
                reasonGroup.style.display = 'none';
                reasonInput.removeAttribute('required');
                reasonInput.value = '';
            }
        };

        document.getElementById('meetingForm').addEventListener('submit', handleSubmitMeeting);
        document.getElementById('passwordForm').addEventListener('submit', (e) => { e.preventDefault(); handlePasswordCheck(e); });
        document.getElementById('attendanceForm').addEventListener('submit', handleAddAttendee);
        
        imageInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                try {
                    showToast("⏳ Memproses gambar...", "info");
                    const base64 = await compressAndConvertToBase64(file);
                    currentImageBase64 = base64;
                    previewImg.src = base64;
                    previewImg.style.display = 'block';
                    showToast("✅ Gambar siap diupload", "success");
                } catch (error) {
                    showToast("❌ " + error.message, "error");
                    imageInput.value = '';
                    previewImg.style.display = 'none';
                    currentImageBase64 = null;
                }
            }
        });

        function initRealtimeListener() {
            const q = query(meetingsCol, orderBy("datetime", "asc"));
            onSnapshot(q, (snapshot) => {
                meetings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderMeetings();
                
                // Realtime update untuk modal jika sedang terbuka
                if (activeMeetingId) {
                    const activeMeeting = meetings.find(m => m.id === activeMeetingId);
                    if (activeMeeting) {
                        document.getElementById('attMeetingTitle').textContent = activeMeeting.title;
                        renderAttendeeList(activeMeeting.attendees || []);
                    }
                }

                if (meetings.length === 0) {
                    grid.innerHTML = `<div class="empty-state"><i class="ph ph-calendar-x" style="font-size: 3rem;"></i><h3>Belum ada jadwal GMRJ</h3><p>✅ Terhubung ke Database Zoom-APS</p></div>`;
                }
            }, (error) => {
                console.error("Error Firebase:", error);
                grid.innerHTML = `<div class="empty-state" style="color:var(--accent);"><i class="ph ph-warning-circle" style="font-size: 3rem;"></i><h3>❌ Error Koneksi Database</h3><p>Error: ${error.message}</p></div>`;
            });
        }

        initRealtimeListener();

        function compressAndConvertToBase64(file) {
            return new Promise((resolve, reject) => {
                const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
                if (!allowedTypes.includes(file.type)) { reject(new Error("Format file harus jpg, png, gif, atau webp")); return; }
                const MAX_SIZE = 800 * 1024;
                if (file.size > MAX_SIZE) { reject(new Error(`Ukuran gambar maksimal 800KB (${(file.size / 1024).toFixed(0)}KB terdeteksi)`)); return; }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width, height = img.height;
                            const MAX_WIDTH = 800, MAX_HEIGHT = 600;

                            if (width > MAX_WIDTH || height > MAX_HEIGHT) {
                                if (width > height) {
                                    if (width > MAX_WIDTH) { height = Math.round(height * (MAX_WIDTH / width)); width = MAX_WIDTH; }
                                } else {
                                    if (height > MAX_HEIGHT) { width = Math.round(width * (MAX_HEIGHT / height)); height = MAX_HEIGHT; }
                                }
                            }

                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, width, height); ctx.drawImage(img, 0, 0, width, height);
                            const base64 = canvas.toDataURL('image/jpeg', 0.75);
                            resolve(base64);
                        } catch (error) { reject(new Error("Gagal memproses gambar: " + error.message)); }
                    };
                    img.onerror = () => reject(new Error("File bukan gambar yang valid"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Gagal membaca file"));
                reader.readAsDataURL(file);
            });
        }

        async function handleSubmitMeeting(e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;
            const datetime = document.getElementById('datetime').value;
            const location = document.getElementById('location').value;
            const link = document.getElementById('link').value;
            const pdfLink = document.getElementById('pdfLink').value;
            const meetingId = editMeetingId.value;

            submitBtn.disabled = true; 
            submitBtn.innerHTML = '<i class="ph ph-spinner"></i> Menyimpan...';

            try {
                if (isEditMode && meetingId) {
                    const meetingRef = doc(db, "meetings", meetingId);
                    const updateData = { title, desc, datetime, location, link, pdfLink };
                    if (currentImageBase64) updateData.image = currentImageBase64;
                    await updateDoc(meetingRef, updateData);
                    showToast("✅ Meeting berhasil diupdate!", "success");
                } else {
                    const imageUrl = currentImageBase64 || "https://picsum.photos/seed/zoom/400/200";
                    await addDoc(meetingsCol, { 
                        title, desc, datetime, location, link, pdfLink, 
                        image: imageUrl, 
                        attendees: [], 
                        createdAt: new Date().toISOString() 
                    });
                    showToast("✅ Meeting tersimpan ke Cloud!", "success");
                }
                closeModal('formModal'); 
                resetForm();
            } catch (error) {
                console.error(error); 
                showToast("❌ Error: " + error.message, "error");
            } finally {
                submitBtn.disabled = false; 
                submitBtn.innerHTML = '<i class="ph ph-cloud-arrow-up"></i> Simpan ke Cloud';
            }
        }

        window.openEditMeeting = async (id) => {
            try {
                const meetingRef = doc(db, "meetings", id);
                const meetingSnap = await getDoc(meetingRef);
                if (meetingSnap.exists()) {
                    const data = meetingSnap.data();
                    isEditMode = true; 
                    editMeetingId.value = id; 
                    formTitle.textContent = "✏️ Edit Meeting GMRJ";
                    document.getElementById('title').value = data.title;
                    document.getElementById('desc').value = data.desc;
                    document.getElementById('datetime').value = data.datetime;
                    document.getElementById('location').value = data.location;
                    document.getElementById('link').value = data.link;
                    document.getElementById('pdfLink').value = data.pdfLink || "";
                    
                    if (data.image && data.image.startsWith('data:')) { 
                        previewImg.src = data.image; 
                        previewImg.style.display = 'block'; 
                        currentImageBase64 = data.image; 
                    }
                    openModal('formModal');
                }
            } catch (error) { 
                showToast("❌ Gagal memuat data meeting", "error"); 
            }
        };

        window.performDelete = async (id) => {
            if(confirm('⚠️ Hapus meeting ini dari server?')) {
                try { 
                    await deleteDoc(doc(db, "meetings", id)); 
                    showToast("🗑️ Meeting dihapus", "info"); 
                }
                catch (error) { 
                    showToast("❌ Gagal menghapus", "error"); 
                }
            }
        };

        async function handleAddAttendee(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitAttendance');
            const originalBtnContent = btn.innerHTML;
            const nameInput = document.getElementById('attendeeName');
            const status = document.querySelector('input[name="attStatus"]:checked').value;
            const reason = document.getElementById('attendeeReason').value.trim();

            if (!nameInput.value.trim()) { 
                showToast("❌ Nama tidak boleh kosong", "error"); 
                return; 
            }

            // Validasi jika izin tapi tidak ada keterangan
            if (status === 'Izin' && !reason) {
                showToast("❌ Mohon isi keterangan izin", "error");
                return;
            }

            // Ubah tombol jadi loading
            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Memproses...';

            try {
                const meetingRef = doc(db, "meetings", activeMeetingId);
                const attendeeData = { 
                    name: nameInput.value.trim(), 
                    status,
                    reason: status === 'Izin' ? reason : '', 
                    time: new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}), 
                    timestamp: new Date().toISOString() 
                };
                
                await updateDoc(meetingRef, { attendees: arrayUnion(attendeeData) });
                
                // Feedback Sukses
                showToast(`✅ ${attendeeData.name} berhasil dicatat!`, "success");
                
                // Reset Form
                nameInput.value = '';
                document.getElementById('attendeeReason').value = '';
                document.querySelector('input[name="attStatus"][value="Hadir"]').checked = true;
                toggleReasonField();
                nameInput.focus(); // Kembali fokus ke input nama untuk peserta berikutnya

            } catch (error) { 
                console.error(error); 
                showToast("❌ Gagal absen: " + error.message, "error"); 
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnContent;
            }
        }

        window.checkPassword = (action, id = null) => { 
            pendingAction = action; 
            pendingDeleteId = id; 
            pendingEditId = id; 
            document.getElementById('securityPass').value = ''; 
            openModal('passwordModal'); 
        };

        window.handlePasswordCheck = (e) => {
            e.preventDefault();
            const input = document.getElementById('securityPass').value;
            if (input === PASSWORD) {
                closeModal('passwordModal');
                if (pendingAction === 'add') { resetForm(); openModal('formModal'); }
                else if (pendingAction === 'edit') openEditMeeting(pendingEditId);
                else if (pendingAction === 'delete') performDelete(pendingDeleteId);
            } else { 
                showToast("❌ Password Salah!", "error"); 
            }
        };

        window.openAttendance = (id) => {
            activeMeetingId = id;
            const meeting = meetings.find(m => m.id === id);
            if(meeting) {
                document.getElementById('attMeetingTitle').textContent = meeting.title;
                renderAttendeeList(meeting.attendees || []);
                openModal('attendanceModal');
                // Auto fokus ke input nama saat modal dibuka
                setTimeout(() => document.getElementById('attendeeName').focus(), 300);
            }
        };

        function formatDateTime(datetimeStr) {
            const date = new Date(datetimeStr);
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            return {
                dateStr: `${days[date.getDay()]}, ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`,
                timeStr: `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')} WIB`
            };
        }

        function renderMeetings() {
            grid.innerHTML = '';
            meetings.forEach(m => {
                const { dateStr, timeStr } = formatDateTime(m.datetime);
                const attendeeCount = m.attendees ? m.attendees.length : 0;
                
                const pdfBtnHtml = m.pdfLink 
                    ? `<a href="${m.pdfLink}" target="_blank" class="btn-card btn-pdf">
                        <i class="ph ph-file-pdf"></i> Download PDF / Materi
                       </a>` 
                    : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${m.image}" class="card-image" onerror="this.src='https://picsum.photos/seed/${m.id}/400/200'">
                    <div class="card-body">
                        <div class="card-title">${escapeHtml(m.title)}</div>
                        <div class="card-desc">${escapeHtml(m.desc)}</div>
                        <div class="timer-box">
                            <div class="timer-label">⏱️ Hitung Mundur</div>
                            <div class="countdown" data-time="${m.datetime}">--:--:--</div>
                        </div>
                        <div class="info-row"><i class="ph ph-calendar-blank"></i> ${dateStr}</div>
                        <div class="info-row"><i class="ph ph-clock"></i> ${timeStr}</div>
                        <div class="info-row"><i class="ph ph-map-pin"></i> ${escapeHtml(m.location)}</div>
                        
                        <div class="card-actions">
                            ${pdfBtnHtml}
                            <button onclick="openAttendance('${m.id}')" class="btn-card btn-attend">
                                <i class="ph ph-check-square"></i> Absensi (${attendeeCount})
                            </button>
                            <a href="${m.link}" target="_blank" class="btn-card btn-join">
                                <i class="ph ph-video-camera"></i> Masuk Zoom Sekarang
                            </a>
                            <div class="btn-row">
                                <button onclick="checkPassword('edit', '${m.id}')" class="btn-card btn-edit">
                                    <i class="ph ph-pencil-simple"></i> Edit
                                </button>
                                <button onclick="checkPassword('delete', '${m.id}')" class="btn-card btn-delete">
                                    <i class="ph ph-trash"></i> Hapus
                                </button>
                            </div>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
            updateTimers();
        }

        function renderAttendeeList(list) {
            const container = attendeeListContainer;
            document.getElementById('attCount').textContent = list.length;
            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 2rem; font-size:0.85rem; color:var(--text-muted);"><i class="ph ph-users" style="font-size: 2rem; display: block; margin-bottom: 0.5rem;"></i>Belum ada yang absen</div>';
                return;
            }
            container.innerHTML = '';
            const sortedList = [...list].reverse();
            
            sortedList.forEach((att) => {
                const statusClass = att.status === 'Hadir' ? 'status-hadir' : 'status-izin';
                const statusIcon = att.status === 'Hadir' ? '<i class="ph ph-check"></i>' : '<i class="ph ph-warning"></i>';
                const reasonHtml = att.reason ? `<div class="attendee-reason">"${escapeHtml(att.reason)}"</div>` : '';
                
                container.innerHTML += `
                    <div class="attendee-item">
                        <div class="attendee-header">
                            <span class="attendee-name">${escapeHtml(att.name)}</span>
                            <span class="attendee-time">${att.time}</span>
                        </div>
                        <div class="attendee-status ${statusClass}">${statusIcon} ${att.status}</div>
                        ${reasonHtml}
                    </div>`;
            });

            // Scroll otomatis ke bawah agar nama baru terlihat
            container.scrollTop = container.scrollHeight;
        }

        function updateTimers() {
            setInterval(() => {
                document.querySelectorAll('.countdown').forEach(el => {
                    const diff = new Date(el.dataset.time) - new Date();
                    if (diff <= 0) { el.textContent = "🎯 SEKARANG"; el.className = "countdown finished"; }
                    else {
                        const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
                        el.className = diff < 3600000 ? "countdown urgent" : "countdown";
                        el.textContent = `${d>0?d+'d ':''}${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                    }
                });
            }, 1000);
        }

        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => {
            document.getElementById(id).classList.remove('active');
            if(id === 'attendanceModal') activeMeetingId = null;
        }
        window.resetForm = () => { 
            const form = document.getElementById('meetingForm');
            form.reset(); 
            previewImg.style.display = 'none'; 
            currentImageBase64 = null; 
            imageInput.value = ''; 
            editMeetingId.value = ''; 
            isEditMode = false; 
            formTitle.textContent = '📅 Jadwal Baru GMRJ'; 
        };
        function showToast(msg, type='info') {
            const t = document.createElement('div'); t.className = `toast ${type}`;
            const icon = type === 'success' ? 'ph-check-circle' : type === 'error' ? 'ph-warning-circle' : 'ph-info';
            t.innerHTML = `<i class="ph ${icon}"></i> <span>${msg}</span>`;
            toastContainer.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        }
        function escapeHtml(text) { if(!text) return ""; return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
